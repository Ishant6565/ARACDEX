<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="lightAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lightHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="60%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#3f2305"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#080505"/>
  <circle cx="300" cy="270" r="240" fill="url(#lightAura)"/>
  <circle cx="300" cy="270" r="215" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.35"/>
  
  <!-- High School Uniform / Beige Suit & Red Tie -->
  <path d="M140 540 L230 370 L300 410 L370 370 L460 540 L520 600 L80 600 Z" fill="#78350f" stroke="#92400e" stroke-width="2"/>
  <path d="M240 380 L300 440 L360 380 Z" fill="#f8fafc"/>
  <polygon points="295,400 305,400 308,490 292,490" fill="#dc2626"/>

  <!-- Death Note Book held in corner -->
  <rect x="80" y="470" width="80" height="110" rx="3" transform="rotate(15 120 525)" fill="#09090b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="95" y="525" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="10" transform="rotate(15 95 525)">DEATH NOTE</text>

  <!-- Neck -->
  <path d="M260 330 L340 330 L345 390 L255 390 Z" fill="#fed7aa"/>
  
  <!-- Handsome Scheming Face / Chiseled Jaw -->
  <polygon points="220,220 235,320 300,370 365,320 380,220 365,170 235,170" fill="#ffedd5"/>
  <!-- Evil Genius Smirk -->
  <path d="M275 330 Q310 348 335 325" stroke="#7f1d1d" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Piercing Crimson Eyes of Kira -->
  <polygon points="245,240 278,235 280,250 248,252" fill="#ffffff"/>
  <circle cx="264" cy="244" r="6" fill="#dc2626" stroke="#450a0a" stroke-width="1.5"/>
  <polygon points="355,240 322,235 320,250 352,252" fill="#ffffff"/>
  <circle cx="336" cy="244" r="6" fill="#dc2626" stroke="#450a0a" stroke-width="1.5"/>

  <!-- Neat Light Brown / Auburn Layered Hair -->
  <path d="M300 45 Q210 65 195 160 Q185 240 210 290 L235 220 L245 160 Z" fill="url(#lightHair)"/>
  <path d="M300 45 Q390 65 405 160 Q415 240 390 290 L365 220 L355 160 Z" fill="url(#lightHair)"/>
  <!-- Side bangs -->
  <path d="M235 140 L260 230 L280 150 Z" fill="#b45309"/>
  <path d="M365 140 L340 230 L320 150 Z" fill="#b45309"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="42" y="52" fill="#fee2e2" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">LIGHT YAGAMI</text>
  <text x="42" y="570" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">GOD OF NEW WORLD // デスノート</text>
</svg>