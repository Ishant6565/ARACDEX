<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="itachiAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7f1d1d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="itachiHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="60%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#070505"/>
  <circle cx="300" cy="270" r="240" fill="url(#itachiAura)"/>
  <circle cx="300" cy="270" r="210" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35"/>

  <!-- Akatsuki High Cloak -->
  <path d="M140 540 L230 380 L300 420 L370 380 L460 540 L520 600 L80 600 Z" fill="#0d0d11" stroke="#dc2626" stroke-width="2"/>
  <!-- Red Inner Collar -->
  <path d="M230 380 L300 420 L370 380 L350 430 L300 450 L250 430 Z" fill="#991b1b"/>
  <!-- Red Cloud Outline -->
  <path d="M270 510 Q285 495 300 510 Q315 495 330 510 Q345 525 330 540 Q315 550 300 540 Q285 550 270 540 Q255 525 270 510 Z" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/>

  <!-- Neck -->
  <path d="M260 340 L340 340 L345 400 L255 400 Z" fill="#fed7aa"/>

  <!-- Face -->
  <polygon points="220,230 235,330 300,375 365,330 380,230 365,180 235,180" fill="#fde68a"/>
  
  <!-- Itachi's Iconic Tear Trough Facial Lines -->
  <path d="M255 275 L245 330" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M345 275 L355 330" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Scratched Rogue Leaf Headband -->
  <rect x="210" y="160" width="180" height="42" rx="3" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
  <!-- Leaf Symbol -->
  <circle cx="300" cy="181" r="10" fill="none" stroke="#1e293b" stroke-width="2"/>
  <path d="M295 186 Q300 174 308 178" stroke="#1e293b" stroke-width="2" fill="none"/>
  <!-- Horizontal Strike-Through Line (Rogue Shinobi) -->
  <line x1="225" y1="181" x2="375" y2="181" stroke="#dc2626" stroke-width="3"/>

  <!-- Sharingan Eyes (Glowing Crimson Red) -->
  <!-- Left Eye -->
  <polygon points="240,250 275,245 280,260 245,262" fill="#ffffff"/>
  <circle cx="260" cy="254" r="9" fill="#dc2626" stroke="#000000" stroke-width="1.5"/>
  <circle cx="260" cy="254" r="3" fill="#000000"/>
  <!-- Tomoe dots -->
  <circle cx="258" cy="249" r="1.5" fill="#000000"/>
  <circle cx="264" cy="253" r="1.5" fill="#000000"/>
  <circle cx="259" cy="258" r="1.5" fill="#000000"/>

  <!-- Right Eye -->
  <polygon points="360,250 325,245 320,260 355,262" fill="#ffffff"/>
  <circle cx="340" cy="254" r="9" fill="#dc2626" stroke="#000000" stroke-width="1.5"/>
  <circle cx="340" cy="254" r="3" fill="#000000"/>
  <circle cx="338" cy="249" r="1.5" fill="#000000"/>
  <circle cx="344" cy="253" r="1.5" fill="#000000"/>
  <circle cx="339" cy="258" r="1.5" fill="#000000"/>

  <!-- Sleek Jet Black Hair Framing Face -->
  <path d="M190 140 C170 250, 190 320, 230 360 L215 320 L210 240 Z" fill="url(#itachiHair)"/>
  <path d="M410 140 C430 250, 410 320, 370 360 L385 320 L390 240 Z" fill="url(#itachiHair)"/>
  <!-- Bangs parting in middle -->
  <path d="M220 180 L235 290 L260 220 Z" fill="url(#itachiHair)"/>
  <path d="M380 180 L365 290 L340 220 Z" fill="url(#itachiHair)"/>
  <!-- Top hair -->
  <path d="M220 160 Q300 90 380 160 L350 110 Q300 70 250 110 Z" fill="#18181b"/>

  <!-- Crow Feathers floating -->
  <path d="M120 220 Q140 210 150 235 Q135 240 120 220 Z" fill="#1e1e24"/>
  <path d="M470 320 Q490 310 500 335 Q485 340 470 320 Z" fill="#1e1e24"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.7" stroke="#dc2626" stroke-width="1.5"/>
  <text x="42" y="52" fill="#fee2e2" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">ITACHI UCHIHA</text>
  <text x="42" y="570" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">TSUKUYOMI // 万華鏡写輪眼</text>
</svg>
