<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="narutoAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="narutoHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#080605"/>
  <circle cx="300" cy="270" r="240" fill="url(#narutoAura)"/>
  <circle cx="300" cy="270" r="215" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- Orange Track Jacket -->
  <path d="M140 540 L230 380 L300 420 L370 380 L460 540 L520 600 L80 600 Z" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
  <path d="M230 380 L300 425 L370 380 L350 435 L300 460 L250 435 Z" fill="#1e293b"/>
  <!-- Uzumaki Spiral on Chest -->
  <circle cx="300" cy="500" r="22" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <path d="M300 485 Q310 495 300 505 Q290 515 300 520" stroke="#ffffff" stroke-width="3" fill="none"/>

  <!-- Neck -->
  <path d="M260 340 L340 340 L345 400 L255 400 Z" fill="#fed7aa"/>
  
  <!-- Face / Jaw -->
  <polygon points="220,230 235,330 300,380 365,330 380,230 365,180 235,180" fill="#ffedd5"/>
  <!-- Confident Grin -->
  <path d="M265 335 Q300 355 335 335" stroke="#9a3412" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Whiskers on cheeks -->
  <line x1="230" y1="285" x2="255" y2="280" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="228" y1="295" x2="256" y2="293" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="232" y1="305" x2="254" y2="306" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="370" y1="285" x2="345" y2="280" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="372" y1="295" x2="344" y2="293" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="368" y1="305" x2="346" y2="306" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Leaf Shinobi Headband (Black Cloth + Metal Plate) -->
  <rect x="210" y="160" width="180" height="42" rx="3" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="300" cy="181" r="10" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M295 186 Q300 174 308 178" stroke="#0f172a" stroke-width="2" fill="none"/>

  <!-- Sage / Blue Eyes -->
  <polygon points="245,245 278,242 280,258 248,260" fill="#ffffff"/>
  <circle cx="264" cy="251" r="7" fill="#0284c7" stroke="#000" stroke-width="1.5"/>
  <circle cx="264" cy="251" r="3" fill="#000"/>
  <polygon points="355,245 322,242 320,258 352,260" fill="#ffffff"/>
  <circle cx="336" cy="251" r="7" fill="#0284c7" stroke="#000" stroke-width="1.5"/>
  <circle cx="336" cy="251" r="3" fill="#000"/>

  <!-- Spiky Bright Yellow Hair -->
  <path d="M300 45 L270 120 L230 65 L230 145 L175 95 L200 175 L155 160 L180 230 L160 270 L220 240 L195 190 L240 140 L280 110 L300 45 Z" fill="url(#narutoHair)"/>
  <path d="M300 45 L330 120 L370 65 L370 145 L425 95 L400 175 L445 160 L420 230 L440 270 L380 240 L405 190 L360 140 L320 110 L300 45 Z" fill="url(#narutoHair)"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.8" stroke="#f97316" stroke-width="1.5"/>
  <text x="42" y="52" fill="#ffedd5" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">NARUTO UZUMAKI</text>
  <text x="42" y="570" fill="#fdba74" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">SEVENTH HOKAGE // 七代目火影</text>
</svg>