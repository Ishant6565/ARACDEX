<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="leviAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leviHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#06080b"/>
  <circle cx="300" cy="270" r="240" fill="url(#leviAura)"/>
  
  <!-- Wings of Freedom Shield Silhouette in Background -->
  <path d="M260 120 L340 120 L350 200 Q300 240 250 200 Z" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Survey Corps Uniform (Brown Jacket & Harness) -->
  <path d="M140 520 L220 380 L300 420 L380 380 L460 520 L520 600 L80 600 Z" fill="#58311a" stroke="#854d0e" stroke-width="2"/>
  <!-- Leather Straps -->
  <line x1="200" y1="400" x2="400" y2="560" stroke="#291508" stroke-width="8"/>
  <line x1="400" y1="400" x2="200" y2="560" stroke="#291508" stroke-width="8"/>

  <!-- Iconic White Ascot / Cravat Tie -->
  <polygon points="260,370 340,370 330,440 300,470 270,440" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M280 390 Q300 430 320 390" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Neck -->
  <path d="M260 320 L340 320 L345 380 L255 380 Z" fill="#fed7aa"/>

  <!-- Face / Sharp Stern Jaw -->
  <polygon points="225,230 240,315 300,355 360,315 375,230 360,180 240,180" fill="#ffedd5"/>

  <!-- Narrow Cold Steel Eyes -->
  <!-- Left Eye -->
  <polygon points="245,248 280,244 275,256 250,258" fill="#ffffff"/>
  <circle cx="265" cy="252" r="5" fill="#475569" stroke="#0f172a" stroke-width="1"/>
  <!-- Under-eye tired shadow lines -->
  <path d="M248 262 Q265 266 278 262" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>

  <!-- Right Eye -->
  <polygon points="355,248 320,244 325,256 350,258" fill="#ffffff"/>
  <circle cx="335" cy="252" r="5" fill="#475569" stroke="#0f172a" stroke-width="1"/>
  <path d="M322 262 Q335 266 352 262" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>

  <!-- Cold Straight Mouth -->
  <line x1="280" y1="320" x2="320" y2="320" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Classic Undercut Hair with Middle Parting -->
  <!-- Side Undercuts (Shorter/Faded) -->
  <path d="M210 200 L235 250 L230 200 Z" fill="#27272a"/>
  <path d="M390 200 L365 250 L370 200 Z" fill="#27272a"/>
  <!-- Dark Curtains Bangs Parted in Middle -->
  <path d="M300 130 C250 140, 220 180, 235 250 L260 210 Q280 160 300 180 Z" fill="url(#leviHair)"/>
  <path d="M300 130 C350 140, 380 180, 365 250 L340 210 Q320 160 300 180 Z" fill="url(#leviHair)"/>
  <path d="M250 130 Q300 90 350 130 L330 110 Q300 80 270 110 Z" fill="#000000"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="52" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">LEVI ACKERMAN</text>
  <text x="42" y="570" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">SURVEY CORPS // 人類最強</text>
</svg>
