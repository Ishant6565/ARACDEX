<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="sasukeAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sasukeHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#06060c"/>
  <circle cx="300" cy="270" r="240" fill="url(#sasukeAura)"/>
  <circle cx="300" cy="270" r="215" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.4"/>
  
  <!-- High Collar Grey/Navy Cloak -->
  <path d="M140 540 L230 370 L300 410 L370 370 L460 540 L520 600 L80 600 Z" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M240 380 L300 440 L360 380 Z" fill="#312e81"/>
  <circle cx="300" cy="460" r="14" fill="#a855f7" opacity="0.7"/>

  <!-- Neck -->
  <path d="M260 330 L340 330 L345 390 L255 390 Z" fill="#fed7aa"/>
  
  <!-- Face / Jaw -->
  <polygon points="220,220 235,320 300,370 365,320 380,220 365,170 235,170" fill="#ffedd5"/>
  <!-- Cold Stoic Expression -->
  <line x1="275" y1="335" x2="325" y2="335" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Eye: Eternal Mangekyo Sharingan (Red) -->
  <polygon points="245,240 278,235 280,250 248,252" fill="#ffffff"/>
  <circle cx="264" cy="245" r="7" fill="#dc2626" stroke="#000" stroke-width="1.5"/>
  <circle cx="264" cy="245" r="3" fill="#000"/>

  <!-- Right Eye: Rinnegan (Purple with Concentric Rings) -->
  <polygon points="355,240 322,235 320,250 352,252" fill="#ffffff"/>
  <circle cx="336" cy="245" r="8" fill="#a855f7" stroke="#3b0764" stroke-width="1.5"/>
  <circle cx="336" cy="245" r="5" fill="none" stroke="#3b0764" stroke-width="1"/>
  <circle cx="336" cy="245" r="2" fill="#3b0764"/>
  <!-- Rinnegan Tomoe -->
  <circle cx="333" cy="242" r="1" fill="#000"/>
  <circle cx="339" cy="242" r="1" fill="#000"/>

  <!-- Iconic Spiky Sasuke Hair (Splayed at back, long fringe framing face) -->
  <path d="M300 40 L260 110 L220 50 L210 130 L160 90 L180 180 L140 180 L170 250 L210 210 L230 330 L250 210 Z" fill="url(#sasukeHair)"/>
  <path d="M300 40 L340 110 L380 50 L390 130 L440 90 L420 180 L460 180 L430 250 L390 210 L370 330 L350 210 Z" fill="url(#sasukeHair)"/>
  <!-- Front Bangs sweeping across right eye -->
  <path d="M310 160 L350 270 L330 190 Z" fill="#1e1b4b"/>
  <!-- Chidori Sparks in background -->
  <path d="M120 200 L140 220 L130 240 L160 260" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M480 200 L460 220 L470 240 L440 260" stroke="#c084fc" stroke-width="2" fill="none"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="42" y="52" fill="#ede9fe" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">SASUKE UCHIHA</text>
  <text x="42" y="570" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">SHADOW HOKAGE // うちはサスケ</text>
</svg>