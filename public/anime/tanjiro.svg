  <text x="42" y="52" fill="#d1fae5" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">TANJIRO KAMADO</text>
  <text x="42" y="570" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">SUN BREATHING // ヒノカミ神楽</text>
