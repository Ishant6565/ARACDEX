<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="erenAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="erenHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#271c19"/>
      <stop offset="60%" stop-color="#18110f"/>
      <stop offset="100%" stop-color="#0c0807"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#060807"/>
  <circle cx="300" cy="270" r="240" fill="url(#erenAura)"/>
  <circle cx="300" cy="270" r="215" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.35"/>
  
  <!-- Survey Corps Long Dark Trenchcoat -->
  <path d="M140 540 L230 380 L300 420 L370 380 L460 540 L520 600 L80 600 Z" fill="#1c1917" stroke="#10b981" stroke-width="2"/>
  <path d="M240 390 L300 450 L360 390 Z" fill="#292524"/>
