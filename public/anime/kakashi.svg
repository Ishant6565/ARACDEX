<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="kakashiAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kakashiHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#07090d"/>
  <circle cx="300" cy="270" r="240" fill="url(#kakashiAura)"/>
  <circle cx="300" cy="270" r="215" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35"/>
  
  <!-- Jonin Flak Vest (Dark Green) -->
  <path d="M140 540 L230 380 L300 410 L370 380 L460 540 L520 600 L80 600 Z" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <rect x="260" y="440" width="80" height="40" rx="2" fill="#166534" stroke="#15803d"/>
  <circle cx="300" cy="460" r="6" fill="#facc15"/>

  <!-- Kakashi Face Mask (Iconic Dark Blue fabric covering nose to neck) -->
  <path d="M230 250 L235 370 L300 410 L365 370 L370 250 Q300 270 230 250 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M260 270 Q300 290 340 270" stroke="#0f172a" stroke-width="2" fill="none"/>

  <!-- Tilted Leaf Headband Covering Left Eye -->
  <polygon points="200,160 400,195 395,240 195,205" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <rect x="250" y="180" width="100" height="35" rx="2" transform="rotate(10 300 195)" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="300" cy="198" r="8" fill="none" stroke="#0f172a" stroke-width="2"/>

  <!-- Right Eye (Sleepy / Observant Black Eye) -->
  <polygon points="335,235 365,235 360,248 335,248" fill="#ffffff"/>
  <circle cx="348" cy="241" r="5" fill="#0f172a"/>
  <!-- Left Eye scar showing beneath headband -->
  <line x1="260" y1="210" x2="255" y2="260" stroke="#991b1b" stroke-width="2.5"/>

  <!-- Silver Spiky Hair Swept Left -->
  <path d="M300 40 L260 100 L210 55 L215 135 L160 85 L180 170 L150 160 L170 220 L220 190 L270 120 Z" fill="url(#kakashiHair)"/>
  <path d="M300 40 L340 90 L380 50 L385 130 L430 85 L415 170 L450 160 L420 220 L370 180 Z" fill="url(#kakashiHair)"/>
  <!-- Top wild spikes -->
  <path d="M270 70 L240 30 L220 90 L260 90 Z" fill="#f8fafc"/>
  <path d="M330 70 L360 30 L370 90 L330 90 Z" fill="#cbd5e1"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="52" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">KAKASHI HATAKE</text>
  <text x="42" y="570" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">COPY NINJA // 写輪眼のカカシ</text>
</svg>