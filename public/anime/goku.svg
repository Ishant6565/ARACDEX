<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="gokuAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gokuHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#080709"/>
  <circle cx="300" cy="270" r="240" fill="url(#gokuAura)"/>
  
  <!-- Divine God Ki Heat Ripples -->
  <circle cx="300" cy="270" r="215" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.4"/>
  <circle cx="300" cy="270" r="185" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Torn Gi & Undershirt -->
  <path d="M140 520 L230 400 L300 440 L370 400 L460 520 L520 600 L80 600 Z" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
  <polygon points="240,410 360,410 340,490 300,530 260,490" fill="#1e3a8a"/>
  <!-- Muscular Chest (Pale Tan) -->
  <polygon points="265,390 335,390 320,440 300,470 280,440" fill="#fed7aa"/>

  <!-- Neck -->
  <path d="M250 330 L350 330 L355 400 L245 400 Z" fill="#fed7aa"/>

  <!-- Face / Jaw -->
  <polygon points="220,240 240,330 300,370 360,330 380,240 360,180 240,180" fill="#ffedd5"/>

  <!-- Ultra Instinct Silver Eyes -->
  <!-- Left Eye -->
  <polygon points="245,250 280,244 275,258 250,260" fill="#ffffff"/>
  <circle cx="265" cy="253" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="265" cy="253" r="2" fill="#000000"/>
  <!-- Intense Brow -->
  <line x1="240" y1="242" x2="280" y2="246" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right Eye -->
  <polygon points="355,250 320,244 325,258 350,260" fill="#ffffff"/>
  <circle cx="335" cy="253" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="335" cy="253" r="2" fill="#000000"/>
  <line x1="360" y1="242" x2="320" y2="246" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Confident Smile -->
  <path d="M275 330 Q300 342 325 330" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Massive Ultra Instinct Spiky Silver Hair -->
  <path d="M300 40 L270 120 L210 50 L220 150 L150 90 L170 190 L110 180 L160 250 L130 310 L220 250 Z" fill="url(#gokuHair)"/>
  <path d="M300 40 L330 120 L390 50 L380 150 L450 90 L430 190 L490 180 L440 250 L470 310 L380 250 Z" fill="url(#gokuHair)"/>
  <!-- Front Bangs Framing Face -->
  <path d="M240 180 L250 250 L275 200 Z" fill="#ffffff"/>
  <path d="M360 180 L350 250 L325 200 Z" fill="#ffffff"/>
  <path d="M280 180 L300 240 L320 180 Z" fill="#ffffff"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="42" y="52" fill="#fef08a" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">SON GOKU</text>
  <text x="42" y="570" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">ULTRA INSTINCT // 身勝手の極意</text>
</svg>
