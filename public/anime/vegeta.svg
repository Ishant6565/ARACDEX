<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="vegetaAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vegetaHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#06070f"/>
  <circle cx="300" cy="270" r="240" fill="url(#vegetaAura)"/>
  <circle cx="300" cy="270" r="215" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.4"/>
  
  <!-- Saiyan Battle Armor (White Chestplate + Blue Bodysuit) -->
  <path d="M140 540 L230 380 L300 410 L370 380 L460 540 L520 600 L80 600 Z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <path d="M220 400 L300 430 L380 400 L370 560 L230 560 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <path d="M260 450 L340 450 L340 520 L260 520 Z" fill="#ca8a04"/>

  <!-- Neck -->
  <path d="M250 330 L350 330 L355 400 L245 400 Z" fill="#fed7aa"/>
  
  <!-- Chiseled Saiyan Jaw / Proud Scowl -->
  <polygon points="215,220 230,320 300,370 370,320 385,220 370,170 230,170" fill="#ffedd5"/>
  <!-- Proud Saiyan Smirk -->
  <path d="M275 330 Q305 345 335 330" stroke="#78350f" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Intense Blue Super Saiyan Eyes -->
  <polygon points="240,240 275,235 278,252 245,255" fill="#ffffff"/>
  <circle cx="262" cy="246" r="6" fill="#38bdf8" stroke="#0369a1" stroke-width="1.5"/>
  <polygon points="360,240 325,235 322,252 355,255" fill="#ffffff"/>
  <circle cx="338" cy="246" r="6" fill="#38bdf8" stroke="#0369a1" stroke-width="1.5"/>

  <!-- Iconic Flame-shaped Skyward Spiky Hair -->
  <path d="M300 20 L260 90 L210 30 L220 120 L170 70 L190 160 L140 140 L170 210 L215 190 L230 150 L270 120 Z" fill="url(#vegetaHair)"/>
  <path d="M300 20 L340 90 L390 30 L380 120 L430 70 L410 160 L460 140 L430 210 L385 190 L370 150 L330 120 Z" fill="url(#vegetaHair)"/>
  <!-- Center towering spike -->
  <polygon points="270,100 300,20 330,100" fill="#93c5fd"/>
  <!-- Saiyan Widow's Peak Forehead -->
  <polygon points="260,170 300,210 340,170" fill="#fed7aa"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="42" y="52" fill="#dbeafe" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">PRINCE VEGETA</text>
  <text x="42" y="570" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">SAIYAN ROYALTY // ベジータ</text>
</svg>