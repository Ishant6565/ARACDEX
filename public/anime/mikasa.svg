<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="mikasaAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#475569" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mikasaHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="60%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#070708"/>
  <circle cx="300" cy="270" r="240" fill="url(#mikasaAura)"/>
  <circle cx="300" cy="270" r="215" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.35"/>
  
  <!-- Survey Corps Gear & Iconic Red Scarf wrapped around neck -->
  <path d="M140 540 L230 400 L300 440 L370 400 L460 540 L520 600 L80 600 Z" fill="#292524" stroke="#78716c" stroke-width="2"/>
  <!-- Thick Red Scarf -->
  <ellipse cx="300" cy="380" rx="90" ry="35" fill="#b91c1c" stroke="#991b1b" stroke-width="2"/>
  <path d="M260 380 Q300 420 340 380 Q300 440 260 380 Z" fill="#991b1b"/>
  <!-- Scarf tail hanging down -->
  <path d="M310 400 L330 520 L300 510 Z" fill="#dc2626"/>

  <!-- Face / Sharp Elegant Jaw -->
  <polygon points="225,230 240,320 300,365 360,320 375,230 360,180 240,180" fill="#ffedd5"/>
  <!-- Small scar below right eye -->
  <line x1="335" y1="270" x2="345" y2="280" stroke="#b91c1c" stroke-width="2"/>

  <!-- Calm Piercing Dark Grey Eyes -->
  <polygon points="245,245 275,242 278,255 248,256" fill="#ffffff"/>
  <circle cx="262" cy="249" r="6" fill="#334155"/>
  <polygon points="355,245 325,242 322,255 352,256" fill="#ffffff"/>
  <circle cx="338" cy="249" r="6" fill="#334155"/>

  <!-- Short Chic Jet Black Hair with side bangs -->
  <path d="M300 45 Q210 70 190 170 Q180 230 200 280 L230 220 L240 160 Z" fill="url(#mikasaHair)"/>
  <path d="M300 45 Q390 70 410 170 Q420 230 400 280 L370 220 L360 160 Z" fill="url(#mikasaHair)"/>
  <!-- Front Bangs -->
  <path d="M230 150 L250 230 L270 160 Z" fill="#1e1b18"/>
  <path d="M370 150 L350 230 L330 160 Z" fill="#1e1b18"/>
  <path d="M280 150 L300 210 L320 150 Z" fill="#262626"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.5"/>
  <text x="42" y="52" fill="#fee2e2" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">MIKASA ACKERMAN</text>
  <text x="42" y="570" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">HUMANITY'S HOPE // ミカサ</text>
</svg>