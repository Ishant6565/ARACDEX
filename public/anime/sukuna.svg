<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="sukunaAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#991b1b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sukunaHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="60%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#090505"/>
  <circle cx="300" cy="270" r="240" fill="url(#sukunaAura)"/>
  <circle cx="300" cy="270" r="215" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.4"/>
  
  <!-- Kimono Collar / Robe -->
  <path d="M140 540 L230 380 L300 420 L370 380 L460 540 L520 600 L80 600 Z" fill="#18181b" stroke="#f43f5e" stroke-width="2"/>
  <path d="M230 380 L300 440 L370 380 Z" fill="#f8fafc"/>
  <path d="M260 410 L300 470 L340 410 Z" fill="#e11d48"/>
  <circle cx="300" cy="485" r="8" fill="#fbbf24"/>

  <!-- Neck -->
  <path d="M260 340 L340 340 L345 400 L255 400 Z" fill="#fed7aa"/>
  <!-- Sukuna Neck Markings -->
  <path d="M275 350 Q300 370 325 350" stroke="#0f172a" stroke-width="4" fill="none"/>
  <line x1="270" y1="365" x2="330" y2="365" stroke="#0f172a" stroke-width="3"/>

  <!-- Face / Jaw -->
  <polygon points="220,230 235,330 300,380 365,330 380,230 365,180 235,180" fill="#ffedd5"/>
  <!-- Demonic Smirk with Sharp Fangs -->
  <path d="M265 330 Q300 355 335 330" stroke="#881337" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="280,332 286,340 292,332" fill="#ffffff"/>
  <polygon points="308,332 314,340 320,332" fill="#ffffff"/>

  <!-- Sukuna Black Tattoos on Face -->
  <!-- Forehead mark -->
  <circle cx="300" cy="185" r="7" fill="#0f172a"/>
  <rect x="296" y="195" width="8" height="18" fill="#0f172a"/>
  <!-- Cheek lines & Extra lower eyes -->
  <path d="M235 270 Q255 275 270 265" stroke="#0f172a" stroke-width="3.5" fill="none"/>
  <path d="M365 270 Q345 275 330 265" stroke="#0f172a" stroke-width="3.5" fill="none"/>
  <!-- Extra eyes beneath normal eyes -->
  <path d="M245 282 Q258 290 270 282" stroke="#dc2626" stroke-width="2.5" fill="none"/>
  <circle cx="258" cy="283" r="2.5" fill="#dc2626"/>
  <path d="M355 282 Q342 290 330 282" stroke="#dc2626" stroke-width="2.5" fill="none"/>
  <circle cx="342" cy="283" r="2.5" fill="#dc2626"/>

  <!-- Main Crimson Eyes -->
  <polygon points="245,245 278,240 282,255 248,258" fill="#ffffff"/>
  <circle cx="264" cy="250" r="7" fill="#dc2626" stroke="#000" stroke-width="1.5"/>
  <circle cx="264" cy="250" r="3" fill="#000"/>
  <polygon points="355,245 322,240 318,255 352,258" fill="#ffffff"/>
  <circle cx="336" cy="250" r="7" fill="#dc2626" stroke="#000" stroke-width="1.5"/>
  <circle cx="336" cy="250" r="3" fill="#000"/>

  <!-- Spiky Pink/Dark Hair -->
  <path d="M300 45 L270 120 L230 65 L230 145 L180 95 L205 180 L160 160 L185 230 L165 270 L220 240 L200 190 L245 140 L285 110 L300 45 Z" fill="url(#sukunaHair)"/>
  <path d="M300 45 L330 120 L370 65 L370 145 L420 95 L395 180 L440 160 L415 230 L435 270 L380 240 L400 190 L355 140 L315 110 L300 45 Z" fill="url(#sukunaHair)"/>
  <!-- Front Bangs swept back -->
  <path d="M260 150 L280 120 L300 150 L320 120 L340 150 Z" fill="#fda4af"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="170" height="34" rx="2" fill="#000000" fill-opacity="0.8" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="42" y="52" fill="#ffe4e6" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">RYOMEN SUKUNA</text>
  <text x="42" y="570" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">MALEVOLENT SHRINE // 伏魔御廚子</text>
</svg>