<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="nezukoAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#fda4af" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nezukoHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#090507"/>
  <circle cx="300" cy="270" r="240" fill="url(#nezukoAura)"/>
  <circle cx="300" cy="270" r="215" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35"/>
  
  <!-- Pink Asanoha Kimono + Dark Brown Haori -->
  <path d="M140 540 L230 400 L300 440 L370 400 L460 540 L520 600 L80 600 Z" fill="#292524" stroke="#44403c" stroke-width="2"/>
  <path d="M230 400 L300 450 L370 400 L350 600 L250 600 Z" fill="#f472b6"/>
  <!-- Checkered Obi Belt -->
  <rect x="250" y="470" width="100" height="35" fill="#dc2626"/>

  <!-- Face / Gentle Porcelain Jaw -->
  <polygon points="225,230 240,320 300,365 360,320 375,230 360,180 240,180" fill="#fff1f2"/>

  <!-- Iconic Bamboo Muzzle with Red Cords -->
  <rect x="260" y="320" width="80" height="26" rx="6" fill="#84cc16" stroke="#4d7c0f" stroke-width="2"/>
  <line x1="280" y1="320" x2="280" y2="346" stroke="#4d7c0f" stroke-width="2"/>
  <line x1="320" y1="320" x2="320" y2="346" stroke="#4d7c0f" stroke-width="2"/>
  <!-- Red string tied around ears -->
  <line x1="260" y1="333" x2="225" y2="320" stroke="#dc2626" stroke-width="2"/>
  <line x1="340" y1="333" x2="375" y2="320" stroke="#dc2626" stroke-width="2"/>

  <!-- Big Innocent Pink Demon Eyes -->
  <polygon points="245,245 278,242 278,258 248,260" fill="#ffffff"/>
  <circle cx="264" cy="251" r="8" fill="#f43f5e" stroke="#9f1239" stroke-width="1.5"/>
  <circle cx="264" cy="251" r="3" fill="#ffffff"/>
  <polygon points="355,245 322,242 322,258 352,260" fill="#ffffff"/>
  <circle cx="336" cy="251" r="8" fill="#f43f5e" stroke="#9f1239" stroke-width="1.5"/>
  <circle cx="336" cy="251" r="3" fill="#ffffff"/>

  <!-- Long Black Hair fading to Flame-Orange Tips -->
  <path d="M300 45 Q200 70 180 200 Q160 320 180 440 L210 330 L225 210 Z" fill="url(#nezukoHair)"/>
  <path d="M300 45 Q400 70 420 200 Q440 320 420 440 L390 330 L375 210 Z" fill="url(#nezukoHair)"/>
  <!-- Pink Hair Ribbon -->
  <polygon points="230,160 220,140 250,150" fill="#f43f5e"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.8" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="42" y="52" fill="#ffe4e6" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">NEZUKO KAMADO</text>
  <text x="42" y="570" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">DEMON PRINCESS // 竈門禰豆子</text>
</svg>