<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="jinwooAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jinwooHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#05050a"/>
  <circle cx="300" cy="270" r="240" fill="url(#jinwooAura)"/>
  <circle cx="300" cy="270" r="215" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.45"/>
  
  <!-- High Collar Shadow Monarch Long Black Coat -->
  <path d="M140 540 L230 370 L300 410 L370 370 L460 540 L520 600 L80 600 Z" fill="#09090e" stroke="#38bdf8" stroke-width="2"/>
  <path d="M240 380 L300 440 L360 380 Z" fill="#18182b"/>
  <!-- Blue ethereal glow emerging from coat -->
  <path d="M290 440 L300 520 L310 440 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Neck -->
  <path d="M260 330 L340 330 L345 390 L255 390 Z" fill="#fed7aa"/>
  
  <!-- Sharp Striking Jaw -->
  <polygon points="220,220 235,320 300,370 365,320 380,220 365,170 235,170" fill="#ffedd5"/>
  <line x1="275" y1="335" x2="325" y2="335" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Iconic Piercing Glowing Electric Blue Eyes -->
  <polygon points="245,240 278,235 280,250 248,252" fill="#ffffff"/>
  <ellipse cx="264" cy="245" rx="8" ry="5" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
  <polygon points="355,240 322,235 320,250 352,252" fill="#ffffff"/>
  <ellipse cx="336" cy="245" rx="8" ry="5" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>

  <!-- Modern Sharp K-Style Undercut Hair with Bangs framing eyes -->
  <path d="M300 40 Q210 60 190 160 Q175 240 200 290 L230 220 L240 160 Z" fill="url(#jinwooHair)"/>
  <path d="M300 40 Q390 60 410 160 Q425 240 400 290 L370 220 L360 160 Z" fill="url(#jinwooHair)"/>
  <!-- Front Bangs parted slightly -->
  <path d="M240 140 L265 240 L285 150 Z" fill="#1e1b4b"/>
  <path d="M360 140 L335 240 L315 150 Z" fill="#1e1b4b"/>
  <path d="M290 140 L300 220 L310 140 Z" fill="#0f172a"/>

  <!-- Title Badge -->
  <rect x="30" y="30" width="160" height="34" rx="2" fill="#000000" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="52" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">SUNG JIN-WOO</text>
  <text x="42" y="570" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">SHADOW MONARCH // 나 혼자만 레벨업</text>
</svg>